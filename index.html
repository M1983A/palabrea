<style>
:root{--bg:#fff4e3;--card:#fff;--ink:#44322f;--c1:#ff8fa3;--c2:#4fb56f;--c3:#4f9fdc;--c4:#f4b942;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:26px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:760px;margin:0 auto;padding:18px 22px 40px}
.scr{display:none}.scr.on{display:block}
.mas{font-size:120px;line-height:1.1;display:inline-block;-webkit-animation:bob 3s ease-in-out infinite;animation:bob 3s ease-in-out infinite}
@-webkit-keyframes bob{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-10px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:44px;margin:6px 0}
.btn{display:block;width:100%;border:0;border-radius:30px;padding:26px 12px;margin:16px 0;font:700 36px -apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);-webkit-appearance:none}
.btn:active{-webkit-transform:translateY(5px);transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.small{display:inline-block;width:auto;padding:12px 22px;font-size:24px;margin:6px;border-radius:20px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.card{background:var(--card);border-radius:30px;padding:22px 16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.q{font-size:50px;font-weight:700;margin:6px 0}
.vis{font-size:38px;min-height:50px;word-wrap:break-word}
.vis .f{opacity:.2}.vis b{margin:0 12px}
.dots span{display:inline-block;width:22px;height:22px;border-radius:50%;background:#d9cbbd;margin:0 6px}
.dots .d{background:var(--c4)}

.opt{font-size:46px}
.opt.no{opacity:.28}
.opt.ok{background:var(--c2)!important;-webkit-animation:pop .5s;animation:pop .5s}
@-webkit-keyframes pop{50%{-webkit-transform:scale(1.07)}}
@keyframes pop{50%{transform:scale(1.07)}}
#fb{font-size:34px;font-weight:700;min-height:48px}
#hint{font-size:28px;min-height:40px;opacity:.85}
.row{margin:14px 0;font-size:28px}
.btn.small.sel{background:var(--c2)!important}
.grid{display:flex;flex-wrap:wrap;justify-content:space-between}
.grid .btn{width:48.5%;font-size:30px;padding:26px 6px}
.card.hm{padding:0;overflow:hidden}
.cng{border-collapse:separate;border-spacing:8px;margin:10px auto}

.cng td.sm{background:#ffd0da;color:#44322f;font-size:34px}
.cng td.bl{background:#fff3b8;color:#44322f;border:4px dashed #e59a2f}
.cng td.se{background:#dff1ff;color:#44322f;border:4px solid #4f9fdc}
.cng td.xx{background:none;box-shadow:none}
.cng td.fd{background:#bff0c8;color:#44322f}
input{-webkit-user-select:text;user-select:text}
.pad{display:flex;flex-wrap:wrap;justify-content:center}
.pad .btn{width:17%;margin:6px 1%;padding:18px 0;font-size:40px}
</style>

<script>
var S={stars:0,lv:{m:1,s:1,t:1,f:1,c:1,p:1,x:1},snd:true,seen:{m:[],s:[],t:[],f:[],c:[],p:[],r:[],w:[],x:[]}},R={},cur=null,lock=false,voice=null;
function $(i){return document.getElementById(i)}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){var s=document.querySelectorAll('.scr'),i;for(i=0;i<s.length;i++)s[i].className='scr';$(id).className='scr on';window.scrollTo(0,0)}
function load(){try{var d=JSON.parse(localStorage.getItem('rincon')||'null');if(d){S.stars=d.stars||0;S.snd=d.snd!==false;if(d.lv){for(var k in S.lv)S.lv[k]=d.lv[k]||1}if(d.seen){for(var k2 in S.seen)S.seen[k2]=d.seen[k2]||[]}}}catch(e){}}
function save(){try{localStorage.setItem('rincon',JSON.stringify(S))}catch(e){}}

/* Voz en español */
function pickVoice(){if(!window.speechSynthesis)return;var v=speechSynthesis.getVoices(),i;voice=null;
 for(i=0;i<v.length;i++){if(/^es[-_](CL|MX|US|419)/i.test(v[i].lang)){voice=v[i];return}}
 for(i=0;i<v.length;i++){if(/^es/i.test(v[i].lang)){voice=v[i];return}}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!S.snd||!window.speechSynthesis||!t)return;
 try{speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(t.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,'').replace(/[\u2600-\u27BF\uFE0F]/g,''));
 u.lang=voice?voice.lang:'es-ES';if(voice)u.voice=voice;u.rate=0.8;speechSynthesis.speak(u)}catch(e){}}
function sayQ(){if(cur)say(cur.say)}

/* Palabras: [nivel, frase, respuesta, otras opciones, pista] */
var B=[
[1,'___ gato 🐱','el','la|los','Es un solo gato: «el gato».'],
[1,'___ casa 🏠','la','el|las','Es una sola casa: «la casa».'],
[1,'___ flores 🌸','las','los|la','Son varias flores: «las flores».'],
[1,'___ libros 📚','los','las|el','Son varios libros: «los libros».'],
[1,'___ sol ☀️','el','la|las','Se dice «el sol».'],
[1,'___ luna 🌙','la','el|los','Se dice «la luna».'],
[2,'Yo ___ feliz 😊','soy','es|eres','Con «yo» se dice «soy».'],
[2,'Tú ___ amable 💛','eres','soy|es','Con «tú» se dice «eres».'],
[2,'Ella ___ en casa 🏠','está','estoy|están','Con «ella» se dice «está».'],
[2,'Yo ___ pan 🍞','como','comes|come','Con «yo» se dice «como».'],
[2,'Nosotros ___ café ☕','tomamos','toma|tomo','Con «nosotros» termina en «-amos».'],
[2,'Él ___ un libro 📖','lee','leo|lees','Con «él» se dice «lee».'],
[3,'Los gatos ___ pequeños 🐱','son','es|soy','Son varios gatos: «son».'],
[3,'Las flores son ___ 🌷','bonitas','bonito|bonita','«Flores» es femenino y plural: «bonitas».'],
[3,'Mi nieta ___ muy simpática','es','son|soy','Es una sola persona: «es».'],
[3,'Ellos ___ en el parque 🌳','están','está|estoy','Con «ellos» se dice «están».'],
[3,'Mañana yo ___ al mercado 🛒','voy','vas|va','Con «yo» se dice «voy».'],
[3,'Nosotras ___ juntas 👵','estamos','están|estoy','Con «nosotras» se dice «estamos».']];

function mkMath(){
 var L=S.lv.m,max=L==1?5:(L==2?10:20),plus=Math.random()<0.6,a,b,ans,i,j,vis='',o=[];
 if(plus){a=rnd(1,max-1);b=rnd(1,max-a);ans=a+b}else{a=rnd(2,max);b=rnd(1,a-1);ans=a-b}
 for(i=-2;i<=2;i++){if(i&&ans+i>=0)o.push(ans+i)}
 o=shuf(o).slice(0,2);o.push(ans);o=shuf(o);
 if(plus){for(i=0;i<a;i++)vis+='🍎';vis+='<b>+</b>';for(i=0;i<b;i++)vis+='🍏'}
 else{for(i=0;i<a-b;i++)vis+='🍎';for(i=0;i<b;i++)vis+='<span class="f">🍎</span>'}
 return{q:a+(plus?' + ':' − ')+b+' = ?',vis:vis,
  say:a+(plus?' más ':' menos ')+b+'. ¿Cuántos son?',
  ans:String(ans),opts:o.map(String),hint:'Cuenta las manzanas con el dedo 👆',full:a+(plus?' más ':' menos ')+b+' son '+ans}}

function mkWord(it){
 var o=shuf([it[2]].concat(it[3].split('|'))),full=it[1].replace('___',it[2]).replace(/ \(.*\)/,'');
 return{q:it[1].replace('___','＿＿＿'),vis:'',say:'¿Qué palabra falta? '+it[1].replace('___',', ,'),
  ans:it[2],opts:o,hint:it[4],full:full}}

var F=[
[1,'La mamá de mi mamá es mi ___ 👵','abuela','tía|hija','Es la mamá de tu mamá: «abuela».'],
[1,'El papá de mi papá es mi ___ 👴','abuelo','tío|hijo','Es el papá de tu papá: «abuelo».'],
[1,'Mi mamá y mi papá son mis ___ 👪','padres','hijos|primos','Mamá y papá son los «padres».'],
[1,'Mi hermana es hija de mi mamá y de mi ___ 👨','papá','tío|abuelo','Las hermanas tienen los mismos padres.'],
[1,'La hija de mi hija es mi ___ 👧','nieta','tía|hermana','Es la hija de tu hija: «nieta».'],
[1,'El hijo de mi hijo es mi ___ 👦','nieto','tío|primo','Es el hijo de tu hijo: «nieto».'],
[2,'El hermano de mi mamá es mi ___ 🧔','tío','abuelo|primo','Es el hermano de tu mamá: «tío».'],
[2,'La hermana de mi papá es mi ___ 👩','tía','prima|abuela','Es la hermana de tu papá: «tía».'],
[2,'El hijo de mi tía es mi ___ 🧒','primo','tío|nieto','Es el hijo de tu tía: «primo».'],
[2,'La esposa de mi hijo es mi ___ 👰','nuera','suegra|cuñada','Es la esposa de tu hijo: «nuera».'],
[2,'El esposo de mi hija es mi ___ 🤵','yerno','suegro|cuñado','Es el esposo de tu hija: «yerno».'],
[2,'La mamá de mi esposo es mi ___ 👵','suegra','nuera|cuñada','Es la mamá de tu esposo: «suegra».'],
[3,'Mis ___ vienen a visitarme 💛','nietos','nieto|nieta','«Vienen» es plural: «nietos».'],
[3,'Mi familia es muy ___ 💛','bonita','bonito|bonitas','«Familia» es femenino: «bonita».'],
[3,'Mis hijas son muy ___ 👩','cariñosas','cariñoso|cariñosa','«Hijas» es femenino y plural.'],
[3,'Yo ___ mucho a mis nietos 💛','quiero','quieres|quiere','Con «yo» se dice «quiero».'],
[3,'Mi hermana y yo ___ en casa 🏠','estamos','está|estoy','Con «yo y ella» se dice «estamos».'],
[3,'Mi nieta ___ a su abuela 💗','abraza','abrazo|abrazas','Una persona: «abraza».']];
var HN=['doce','una','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];
function tx(h,m){var hh=m>30?h%12+1:h,p=hh==1?'Es la ':'Son las ',w=HN[hh];
 if(m==0)return p+w+' en punto';if(m==15)return p+w+' y cuarto';if(m==30)return p+w+' y media';if(m==45)return p+w+' menos cuarto';
 return m<30?p+w+' y '+m:p+w+' menos '+(60-m)}
function mkClock(){
 var L=S.lv.t,ms=L==1?[0,30]:(L==2?[0,15,30,45]:[0,5,10,15,20,25,30,35,40,45,50,55]),h=rnd(1,12),m=ms[rnd(0,ms.length-1)],i,c=[],
 f=function(a,b){return a+':'+(b<10?'0':'')+b},ans=f(h,m),a=(h%12+m/60)*30,b=m*6,s;
 c.push(f(h%12+1,m));c.push(f((h+10)%12+1,m));
 for(i=0;i<ms.length;i++){if(ms[i]!=m)c.push(f(h,ms[i]))}
 var u=[],o=shuf(c);for(i=0;i<o.length&&u.length<2;i++){if(o[i]!=ans&&u.indexOf(o[i])<0)u.push(o[i])}
 u.push(ans);
 s='<svg viewBox="0 0 200 200" width="230" height="230"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#44322f" stroke-width="6"/>';
 for(i=1;i<=12;i++){var t=i*Math.PI/6;s+='<text x="'+(100+74*Math.sin(t)).toFixed(1)+'" y="'+(109-74*Math.cos(t)).toFixed(1)+'" font-size="26" font-weight="700" text-anchor="middle" fill="#44322f">'+i+'</text>'}
 s+='<line x1="100" y1="100" x2="100" y2="58" stroke="#e0708a" stroke-width="10" stroke-linecap="round" transform="rotate('+a+' 100 100)"/><line x1="100" y1="100" x2="100" y2="28" stroke="#4f9fdc" stroke-width="6" stroke-linecap="round" transform="rotate('+b+' 100 100)"/><circle cx="100" cy="100" r="7" fill="#44322f"/></svg>';

/* Crucigrama */
var CWW=[['CASA','🏠'],['SOL','☀️'],['LUNA','🌙'],['FLOR','🌸'],['PAN','🍞'],['GATO','🐱'],['PERRO','🐶'],['TAZA','☕'],['LECHE','🥛'],['LIBRO','📚'],['RELOJ','⌚'],['LLAVE','🔑'],['NUBE','☁️'],['VACA','🐮'],['PEZ','🐟'],['ARBOL','🌳'],['COCHE','🚗'],['PUERTA','🚪'],['CAMISA','👕'],['MANZANA','🍎'],['PLATANO','🍌'],['MARIPOSA','🦋'],['ESTRELLA','⭐'],['TELEFONO','📞'],['SOMBRERO','👒'],['PARAGUAS','☂️'],['BOLSO','👜'],['CAMA','🛏️'],['QUESO','🧀'],['HUEVO','🥚'],['UVA','🍇'],['PERA','🍐'],['NARANJA','🍊'],['LIMON','🍋'],['TORTA','🎂'],['REGALO','🎁'],['MANO','✋'],['OREJA','👂'],['NARIZ','👃'],['BOCA','👄'],['CORAZON','❤️'],['ZAPATO','👞'],['CABALLO','🐴'],['PATO','🦆'],['CERDO','🐷'],['LEON','🦁']];
var CW={};
function cwCells(aw){var a=[],k,v;if(aw=='k'){for(k=0;k<CW.key[0].length;k++)a.push([CW.r0,k])}else{v=CW.V[aw];for(k=0;k<v.w.length;k++)a.push([CW.r0-v.j+k,v.c])}return a}
function cwStart(){var L=S.lv.x,mx=L==1?6:9,ok=function(w){return w[0].length>=5&&w[0].length<=mx},K=CWW.filter(function(w){return ok(w)&&!seenHas('x',w[0])}),t,key,V,cs,i,c,cand,w,j,k,r0,b,G,h='',ab='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 if(K.length<3){S.seen.x=[];K=CWW.filter(ok)}
 for(t=0;t<100;t++){key=K[rnd(0,K.length-1)];V=[];cs=[];
  for(c=0;c<key[0].length;c+=2)cs.push(c);cs=shuf(cs).slice(0,L+1);
  for(i=0;i<cs.length;i++){c=cs[i];
   cand=CWW.filter(function(x){return x[0]!=key[0]&&x[0].length>=3&&x[0].length<=6&&x[0].indexOf(key[0].charAt(c))>-1&&!V.some(function(v){return v.w==x[0]})});
   if(!cand.length)continue;w=cand[rnd(0,cand.length-1)];j=[];
   for(k=0;k<w[0].length;k++){if(w[0].charAt(k)==key[0].charAt(c))j.push(k)}
   V.push({c:c,j:j[rnd(0,j.length-1)],w:w[0],e:w[1]})}
  if(V.length>=2)break}
 r0=0;b=0;for(i=0;i<V.length;i++){r0=Math.max(r0,V[i].j);b=Math.max(b,V[i].w.length-1-V[i].j)}
 G=[];for(i=0;i<r0+b+1;i++){G.push([]);for(k=0;k<key[0].length;k++)G[i].push('')}
 for(k=0;k<key[0].length;k++)G[r0][k]=key[0].charAt(k);
 V.sort(function(x,y){return x.c-y.c});
 for(i=0;i<V.length;i++){V[i].n=i+1;for(k=0;k<V[i].w.length;k++)G[r0-V[i].j+k][V[i].c]=V[i].w.charAt(k)}
 mark('x',key[0]);R={sub:'x'};CW={G:G,r0:r0,key:key,V:V,v:{},sel:null,aw:'k',done:false,bad:false};
 for(i=0;i<26;i++)h+='<button class="btn" style="background:#4f9fdc;width:12%;margin:4px .8%;padding:12px 0;font-size:34px" onclick="cwPress(\''+ab.charAt(i)+'\')">'+ab.charAt(i)+'</button>';
 h+='<button class="btn" style="background:#a89888;width:12%;margin:4px .8%;padding:12px 0;font-size:34px" onclick="cwPress(\'\')">⌫</button>';
 $('cwp').innerHTML=h;$('cwf').innerHTML='';show('cw');cwDraw();say('Resuelve el crucigrama. Mira los dibujos.')}
function cwDraw(){var h='',r,c,i,k,ce,cls,num,v,cl,z=Math.min(80,Math.floor(660/CW.key[0].length)-8),act={},a=cwCells(CW.aw);
 for(i=0;i<a.length;i++)act[a[i][0]+','+a[i][1]]=1;
 for(r=0;r<CW.G.length;r++){h+='<tr>';for(c=0;c<CW.G[0].length;c++){
  if(!CW.G[r][c]){h+='<td class="xx" style="width:'+z+'px;height:'+z+'px"></td>';continue}
  k=r+','+c;ce=CW.v[k]||'';
  cls=(CW.bad&&ce&&ce!=CW.G[r][c])?'sm':((CW.sel&&CW.sel[0]==r&&CW.sel[1]==c)?'se':(act[k]?'bl':''));
  num='';for(i=0;i<CW.V.length;i++){if(CW.V[i].c==c&&r==CW.r0-CW.V[i].j)num=CW.V[i].n}
  h+='<td class="'+cls+'" style="width:'+z+'px;height:'+z+'px;font-size:'+Math.round(z*.5)+'px" onclick="cwSel('+r+','+c+')">'+(num?'<span style="font-size:15px;vertical-align:top">'+num+'</span>':'')+ce+'</td>'}h+='</tr>'}
 $('cwg').innerHTML=h;cl='<b>→</b> '+CW.key[1]+' ('+CW.key[0].length+')';
 for(i=0;i<CW.V.length;i++){v=CW.V[i];cl+=' &nbsp; <b>↓'+v.n+'</b> '+v.e+' ('+v.w.length+')'}
 $('cwc').innerHTML=cl}
function cwSel(r,c){if(CW.done)return;var inK=r==CW.r0,iv=-1,i,v,same=CW.sel&&CW.sel[0]==r&&CW.sel[1]==c;
 for(i=0;i<CW.V.length;i++){v=CW.V[i];if(v.c==c&&r>=CW.r0-v.j&&r<CW.r0-v.j+v.w.length)iv=i}
 if(inK&&iv>-1){if(same)CW.aw=CW.aw=='k'?iv:'k';else if(CW.aw!='k'&&CW.aw!=iv)CW.aw='k'}
 else CW.aw=inK?'k':iv;
 CW.sel=[r,c];CW.bad=false;$('cwf').innerHTML='';cwDraw()}
function cwPress(ch){if(CW.done||!CW.sel)return;var k=CW.sel[0]+','+CW.sel[1],a,i,n;
 if(ch==='')delete CW.v[k];else CW.v[k]=ch;
 CW.bad=false;$('cwf').innerHTML='';
 if(ch){a=cwCells(CW.aw);for(i=0;i<a.length;i++){if(a[i][0]==CW.sel[0]&&a[i][1]==CW.sel[1])n=i}
  for(i=n+1;i<a.length;i++){if(!CW.v[a[i][0]+','+a[i][1]]){CW.sel=a[i];break}}}
 cwDraw();cwCheck()}
function cwCheck(){var r,c,ok=true;
 for(r=0;r<CW.G.length;r++){for(c=0;c<CW.G[0].length;c++){if(CW.G[r][c]){if(!CW.v[r+','+c])return;if(CW.v[r+','+c]!=CW.G[r][c])ok=false}}}
 if(ok){CW.done=true;S.stars++;save();$('cwf').innerHTML='¡Muy bien! ⭐ ¡Resolviste el crucigrama! 🎉';say('¡Muy bien! ¡Resolviste el crucigrama!')}
 else{CW.bad=true;$('cwf').innerHTML='Casi 💛 Las letras rosadas no están bien';say('Casi. Revisa las letras rosadas.');cwDraw()}}
function cwHint(){if(CW.done)return;var r,c,k,t=null;
 if(CW.sel&&CW.v[CW.sel[0]+','+CW.sel[1]]!=CW.G[CW.sel[0]][CW.sel[1]])t=CW.sel;
 else{for(r=0;r<CW.G.length&&!t;r++){for(c=0;c<CW.G[0].length;c++){if(CW.G[r][c]&&CW.v[r+','+c]!=CW.G[r][c]){t=[r,c];break}}}}
 if(!t)return;CW.v[t[0]+','+t[1]]=CW.G[t[0]][t[1]];CW.sel=t;CW.bad=false;$('cwf').innerHTML='💡 Aquí va la '+CW.G[t[0]][t[1]];cwDraw();cwCheck()}

function mindStart(sub){var L=S.lv.x,t,P,qs;
 if(sub=='r'){t=pick1(TX,L,'r');mark('r',t[1]);qs=t[2].map(function(q){return mkQ(q[0],q[1],shuf([q[1]].concat(q[2].split('|'))))});
  R={sub:'r',i:0,done:0,stars:0,N:qs.length,qs:qs,ctx:{},started:false};
  memShow('Lee con calma. Cuando termines, toca el botón y te haré preguntas 📖','<div>'+t[1]+'</div>',t[1],'Ya lo leí ✅')}
 else if(sub=='g'){P=gnScene(L==1?6:8);qs=gnQs(P,L==1?3:4);
  R={sub:'g',i:0,done:0,stars:0,N:qs.length,qs:qs,ctx:{},started:false};
  memShow('Mira bien a las personas: cuántas son, cómo van vestidas y cómo tienen el pelo 👀',gnSvg(P),'','Ya lo miré ✅')}
 else if(sub=='w')flStart();else cwStart()}

/* Ronda */
function start(sub){if(sub=='p'){return frStart()}if(sub=='r'||sub=='g'||sub=='w'||sub=='x'){return mindStart(sub)}
 var pool=[],i,L=S.lv[sub],K=sub=='f'?F:SB;
 if(sub=='s'||sub=='f'){pool=pickQ(K,L,sub)}
 R={sub:sub,i:0,done:0,stars:0,pool:pool};
 show('quiz');nextQ()}
function again(){start(R.sub)}
function dots(){var h='',i;if(lock)$('vz').style.display='none';for(i=0;i<(R.N||5);i++)h+='<span'+(i<R.done?' class="d"':'')+'></span>';$('dots').innerHTML=h}
function nextQ(){
 if(R.i>=(R.N||5)){return finish()}
 cur=(R.sub=='r'||R.sub=='g')?R.qs[R.i]:((R.sub=='m'||R.sub=='t')?mk():mkWord(R.pool[R.i]));if(R.sub=='s'||R.sub=='f')mark(R.sub,R.pool[R.i][1]);R.i++;R.tries=0;lock=false;
 var cols=['#4f9fdc','#a46fd6','#e0708a'],h='',i;
 for(i=0;i<cur.opts.length;i++)h+='<button class="btn opt" style="background:'+cols[i]+'" onclick="pick('+i+')">'+cur.opts[i]+'</button>';
 $('q').innerHTML=cur.q;$('vis').innerHTML=cur.vis;$('opts').innerHTML=h;
 $('fb').innerHTML='';$('hint').innerHTML='';$('nx').style.display='none';$('mq').innerHTML=bear(0,90);
 $('vz').style.display=(R.sub=='s'||R.sub=='f')?'block':'none';$('pk').style.display=R.ctx?'inline-block':'none';$('vbox').style.display='none';$('vin').value='';
 dots();say(cur.say)}
var PR=['¡Muy bien!','¡Excelente!','¡Qué bien lo haces!','¡Perfecto!','¡Bravo!'];
function pick(i){
 if(lock)return;var b=document.querySelectorAll('.opt'),k;
 if(cur.opts[i]===cur.ans){
  lock=true;b[i].className='btn opt ok';S.stars++;R.stars++;R.done++;save();
  var p=PR[rnd(0,PR.length-1)];$('fb').innerHTML=p+' ⭐';$('hint').innerHTML=cur.full;$('mq').innerHTML=bear(1,90);
  $('nx').style.display='block';dots();say(p+' '+cur.full)}
 else{
  R.tries++;b[i].className='btn opt no';b[i].disabled=true;$('mq').innerHTML=bear(0,90);
  if(R.tries>=2){
   lock=true;R.done++;
   for(k=0;k<cur.opts.length;k++){if(cur.opts[k]===cur.ans)b[k].className='btn opt ok'}
   $('fb').innerHTML='Es este 💚 ¡No pasa nada!';$('nx').style.display='block';dots();say('Es este. '+cur.full)}
  else{$('fb').innerHTML='Casi 💛 Intenta otra vez';$('hint').innerHTML=cur.hint;say('Casi. Intenta otra vez. '+cur.hint)}}}
function finish(){
 var s='',i;for(i=0;i<R.stars;i++)s+='⭐';$('es').innerHTML=s||'💛';
 show('end');say('¡Terminaste! ¡Lo hiciste muy bien!')}
function goHome(){try{speechSynthesis.cancel()}catch(e){}
 $('st').innerHTML='⭐ '+S.stars;tick();show('home')}

/* Ajustes (para quien acompaña) */
function openSet(){
 var h='',n=[['m','🍎 Números'],['s','📖 Palabras'],['t','⏰ La hora'],['f','👪 Familia'],['c','🔍 Sopa de números'],['p','🧩 Frases'],['x','🧠 Mente']],i,j,t=['🌱 Fácil','🌿 Medio','🌳 Difícil'];
 for(i=0;i<7;i++){h+='<div class="row"><b>'+n[i][1]+'</b><br>';
  for(j=1;j<=3;j++)h+='<button class="btn small'+(S.lv[n[i][0]]==j?' sel':'')+'" style="background:#a89888" onclick="setLv(\''+n[i][0]+'\','+j+')">'+t[j-1]+'</button>';
  h+='</div>'}
 h+='<div class="row"><button class="btn small" style="background:#a89888" onclick="tgSnd()">'+(S.snd?'🔊 Voz: sí':'🔇 Voz: no')+'</button></div>';
 h+='<div class="row"><button class="btn small" style="background:#a89888" onclick="rst()">Borrar estrellas</button></div>';
 if(window.OFF)h+='<div class="row" style="font-size:22px;opacity:.7">📴 Funciona sin internet ✔️</div>';$('setui').innerHTML=h;show('set')}
function setLv(s,l){S.lv[s]=l;save();openSet()}
function tgSnd(){S.snd=!S.snd;save();openSet()}
function rst(){if(confirm('¿Borrar todas las estrellas?')){S.stars=0;save();openSet()}}

setInterval(function(){if($('home').className.indexOf('on')>-1)tick()},15000);
load();goHome();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(){window.OFF=true}).catch(function(){})})}
